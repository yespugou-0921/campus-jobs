# 每日自动更新岗位（GitHub Actions 定时任务）
# 原理：GitHub 的免费服务器每天早上跑一次爬虫，更新 data.js 并提交回仓库
# 注意：GitHub 的定时用的是 UTC 时间，北京时间 8 点 = UTC 0 点
name: 每日岗位更新

on:
  schedule:
    - cron: "0 0 * * *"        # 每天 UTC 0:00 = 北京时间 8:00
  workflow_dispatch:            # 手动触发按钮（方便随时手动测一次）

permissions:
  contents: write               # 允许任务把更新后的 data.js 提交回仓库

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 取出代码
        uses: actions/checkout@v5

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装 requests 库
        run: pip install requests

      - name: 运行爬虫
        run: python spider.py

      - name: 提交并推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          git diff --cached --quiet || (git commit -m "每日岗位更新 $(date -u +%Y-%m-%d)" && git push)
